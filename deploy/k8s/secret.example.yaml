# NOT part of the kustomization: copy it, fill in real values and apply it yourself (or use your secret manager /
# External Secrets / sealed-secrets), before `kubectl apply -k deploy/k8s`:
#
#   kubectl apply -f deploy/k8s/namespace.yaml
#   kubectl apply -f my-secret.yaml
#
# Never commit real values. Unused provider settings can stay empty.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: payments-ledger
type: Opaque
stringData:
  DATABASE_URL: postgres://ledger:CHANGE_ME@postgres.example.internal:5432/ledger
  REDIS_URL: rediss://:CHANGE_ME@redis.example.internal:6379   # persistent Redis: queue state and schedules live there
  # "<key>:<role>" or "sha256:<hex digest>:<role>", keys of 16+ chars, roles client|admin (NODE_ENV=production requires keys).
  API_KEYS: sha256:REPLACE_WITH_DIGEST:admin
  ALERT_WEBHOOK_URL: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  RAZORPAY_X_ACCOUNT_NUMBER: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""   # tracing is off while empty, e.g. http://otel-collector.observability:4318
