name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: E2E tests with coverage gate (real Postgres + Redis)
        run: npm run test:e2e:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Offline demo
        run: npm run demo
      - name: Docker image builds and boots
        run: |
          docker build -t payments-ledger-service:ci .
          docker run -d --name app --network host \
            -e NODE_ENV=production -e API_KEYS=sk_admin_ci_0123456789abcdef:admin \
            -e DATABASE_URL -e REDIS_URL -e PORT=3055 -e QUEUE_PREFIX=ci-smoke \
            payments-ledger-service:ci
          for i in $(seq 1 30); do curl -fsS localhost:3055/health/ready && break; sleep 1; done
          curl -fsS localhost:3055/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3055/payments)" = 401
          docker logs app | tail -5
          docker rm -f app
